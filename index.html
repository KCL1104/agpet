<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agpet</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <canvas id="pet-canvas"></canvas>

    <div id="chat-panel" class="hidden">
      <div class="chat-header">
        <span id="chat-title">Claude Code</span>
        <div class="chat-header-actions">
          <button id="chat-new" title="End &amp; summarize, start a new session">＋ New</button>
          <button id="chat-history" title="Past sessions">History</button>
          <button id="chat-close" title="Close">×</button>
        </div>
      </div>
      <div id="chat-messages"></div>
      <div id="history-view" class="hidden"></div>
      <div id="permission-bar" class="hidden"></div>
      <div class="chat-input-row">
        <textarea id="chat-input" rows="2" placeholder="Ask Claude…  (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="chat-send">Send</button>
      </div>
    </div>
  </body>
</html>
