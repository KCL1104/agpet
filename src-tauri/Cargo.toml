[package]
name = "agpet"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agpet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Signed in-app auto-update (M0): checks GitHub Releases for a newer signed
# build; process plugin relaunches after install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ACP client core (Milestone 1, step 2).
# The crate spawns the agent subprocess itself (via async_process) and runs the
# whole client as one future, so no direct tokio/tokio-util needed — we drive it
# on Tauri's runtime via tauri::async_runtime::spawn.
agent-client-protocol = { version = "=0.12.1", features = ["unstable_session_model"] }
tokio = { version = "1", features = ["sync", "macros"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Session persistence (Milestone 2). SQLite is vendored by sqlx's sqlite feature.
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"

# Inter-agent orchestration: agpet runs an MCP server exposing a `delegate` tool
# that agents (esp. the "mother") can call. rmcp is already in the tree via ACP.
rmcp = { version = "1.7", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = "1"
axum = "0.8"
tokio-util = "0.7"

# User-editable workflows (M3 Slice 2b). serde_yaml_ng is the maintained
# continuation of the archived serde_yaml (drop-in API, same YAML format).
serde_yaml_ng = "0.10.0"

[dev-dependencies]
# A standalone tokio runtime for async unit tests (the app itself drives async on
# Tauri's runtime, so the normal build doesn't need `rt`).
tokio = { version = "1", features = ["rt", "macros"] }

